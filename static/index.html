<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>곰돌이 진료 일정</title>
<link rel="manifest" href="/manifest.json">
<style>
  :root {
    --bg: #000;
    --bg2: #1c1c1e;
    --bg3: #2c2c2e;
    --border: #38383a;
    --text: #fff;
    --text-sub: #8e8e93;
    --text-faint: #48484a;
    --kim-bg: rgba(10,132,255,0.20);
    --kim-dot: #0a84ff;
    --kim-text: #409cff;
    --kim-past-bg: rgba(10,132,255,0.06);
    --kim-past-text: rgba(64,156,255,0.35);
    --yang-bg: rgba(255,159,10,0.20);
    --yang-dot: #ff9f0a;
    --yang-text: #ffb340;
    --yang-past-bg: rgba(255,159,10,0.06);
    --yang-past-text: rgba(255,179,64,0.35);
    --radius: 13px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; overflow-x: hidden; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 48px; }
  header { padding: 56px 20px 0; }
  .header-month { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  .header-year  { font-size: 34px; font-weight: 300; color: var(--text-sub); letter-spacing: -0.5px; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 0; }
  .nav-arrows { display: flex; gap: 8px; }
  .nav-btn { background: var(--bg3); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--kim-dot); }
  .nav-btn:active { opacity: 0.6; }
  .today-btn { background: none; border: none; color: var(--kim-dot); font-size: 15px; font-family: inherit; cursor: pointer; padding: 4px 0; }
  .legend { display: flex; gap: 14px; padding: 12px 20px 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-sub); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-kim  { background: var(--kim-dot); }
  .dot-yang { background: var(--yang-dot); }
  .calendar-wrap { width: 100%; padding: 0 10px; }
  .day-headers { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 4px; }
  .day-header { text-align: center; padding: 4px 0; font-size: 11px; font-weight: 600; color: var(--text-sub); letter-spacing: 0.2px; }
  .day-header.sun { color: #ff453a; }
  .day-header.sat { color: var(--kim-dot); }
  .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
  .cal-cell { min-height: 66px; padding: 3px 2px 3px; border-radius: 9px; background: var(--bg2); overflow: hidden; cursor: pointer; transition: opacity 0.12s; -webkit-user-select: none; user-select: none; }
  .cal-cell:active { opacity: 0.6; }
  .cal-cell.empty { background: transparent; cursor: default; pointer-events: none; }
  .cal-day-num { font-size: 13px; font-weight: 400; color: var(--text); line-height: 1; margin-bottom: 3px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .cal-cell.sun .cal-day-num { color: #ff453a; }
  .cal-cell.sat .cal-day-num { color: var(--kim-dot); }
  .cal-cell.today .cal-day-num { background: var(--kim-dot); color: #fff; font-weight: 700; }
  .doc-badge { display: block; border-radius: 4px; font-size: 8px; font-weight: 700; padding: 2px 3px; margin-bottom: 2px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .badge-kim       { background: var(--kim-bg);      color: var(--kim-text); }
  .badge-kim.past  { background: var(--kim-past-bg);  color: var(--kim-past-text); }
  .badge-yang      { background: var(--yang-bg);      color: var(--yang-text); }
  .badge-yang.past { background: var(--yang-past-bg); color: var(--yang-past-text); }
  .divider { height: 1px; background: var(--border); margin: 20px 10px 0; }
  .list-section { padding: 0 10px; margin-top: 20px; }
  .list-section-title { font-size: 13px; font-weight: 600; color: var(--text-sub); letter-spacing: 0.3px; margin-bottom: 10px; padding: 0 2px; text-transform: uppercase; }
  .list-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .list-col { background: var(--bg2); border-radius: var(--radius); overflow: hidden; }
  .list-col-header { padding: 10px 12px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); }
  .list-col-header.kim  { color: var(--kim-text); }
  .list-col-header.yang { color: var(--yang-text); }
  .col-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .col-dot.kim  { background: var(--kim-dot); }
  .col-dot.yang { background: var(--yang-dot); }
  .list-row { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12px; min-height: 52px; display: flex; flex-direction: column; justify-content: center; }
  .list-row:last-child { border-bottom: none; }
  .list-row.placeholder { background: transparent; min-height: 52px; }
  .list-date { font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .list-time  { color: var(--text-sub); font-size: 11px; }
  .list-empty { padding: 16px 12px; font-size: 12px; color: var(--text-faint); text-align: center; }
  .status-wrap { text-align: center; padding: 60px 20px; color: var(--text-sub); font-size: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--kim-dot); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .refresh-btn { display: block; margin: 20px auto 0; background: none; border: none; padding: 8px 16px; font-size: 14px; color: var(--kim-dot); cursor: pointer; font-family: inherit; }
  .refresh-btn:disabled { opacity: 0.4; }
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; opacity: 0; transition: opacity 0.28s cubic-bezier(.4,0,.2,1); pointer-events: none; }
  .sheet-backdrop.visible { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1e; border-radius: 20px 20px 0 0; z-index: 101; transform: translateY(100%); transition: transform 0.32s cubic-bezier(.4,0,.2,1); max-height: 80vh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet.visible { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 5px; background: #3a3a3c; border-radius: 3px; margin: 10px auto 4px; flex-shrink: 0; }
  .sheet-header { padding: 6px 20px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sheet-date-label { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
  .sheet-date-dow { font-size: 14px; color: var(--text-sub); margin-top: 2px; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 20px; flex: 1; }
  .duty-card { display: flex; align-items: center; background: #2c2c2e; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; gap: 14px; }
  .duty-card:last-child { margin-bottom: 0; }
  .duty-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .duty-info { flex: 1; min-width: 0; }
  .duty-name { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .duty-time { font-size: 13px; color: var(--text-sub); }
  .duty-time-pill { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 20px; flex-shrink: 0; }
  .sheet-empty { text-align: center; padding: 32px 20px; color: var(--text-faint); font-size: 15px; }
  .sheet-empty-icon { font-size: 36px; margin-bottom: 10px; }
  .nav-map-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: #2c2c2e;
    border: none;
    padding: 16px 20px;
    border-radius: 14px;
    margin-bottom: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav-map-btn:last-child {
    margin-bottom: 0;
  }
  .nav-map-btn:active {
    background: #3a3a3c !important;
  }
  #navDuration {
    cursor: pointer;
    transition: opacity 0.15s;
  }
  #navDuration:active {
    opacity: 0.7;
  }
</style>
</head>
<body>
<header style="display: flex; justify-content: space-between; align-items: flex-end; padding: 56px 20px 0;">
  <div>
    <span class="header-month" id="headerMonth">5월</span><span class="header-year" id="headerYear"> 2026</span>
  </div>
  <div id="navDuration" onclick="openMapSheet()" style="font-size: 13px; font-weight: 600; color: var(--yang-text); display: none; align-items: center; gap: 4px; background: rgba(255,159,10,0.15); padding: 6px 12px; border-radius: 20px;">
    <span>🚗</span> <span id="durationVal">...</span>
  </div>
</header>
<div class="month-nav">
  <button class="today-btn" id="todayBtn">오늘</button>
  <div class="nav-arrows">
    <button class="nav-btn" id="prevBtn">‹</button>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>
</div>
<div class="legend">
  <div class="legend-item"><div class="legend-dot dot-kim"></div>김현 원장</div>
  <div class="legend-item"><div class="legend-dot dot-yang"></div>양희규 원장 (김현 不在시간)</div>
</div>
<div class="calendar-wrap">
  <div class="day-headers">
    <div class="day-header sun">일</div>
    <div class="day-header">월</div>
    <div class="day-header">화</div>
    <div class="day-header">수</div>
    <div class="day-header">목</div>
    <div class="day-header">금</div>
    <div class="day-header sat">토</div>
  </div>
  <div class="calendar-grid" id="calendarGrid">
    <div class="status-wrap" style="grid-column:1/-1"><div class="spinner"></div>불러오는 중...</div>
  </div>
</div>
<div class="divider"></div>
<div class="list-section" id="listSection" style="display:none;">
  <div class="list-section-title">근무 일정 목록</div>
  <div class="list-columns">
    <div class="list-col">
      <div class="list-col-header kim"><div class="col-dot kim"></div>김현 원장</div>
      <div id="kimList"></div>
    </div>
    <div class="list-col">
      <div class="list-col-header yang"><div class="col-dot yang"></div>양희규 원장</div>
      <div id="yangList"></div>
    </div>
  </div>
</div>
<button class="refresh-btn" id="refreshBtn">↻ 새로 불러오기</button>
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-date-label" id="sheetDateLabel">—</div>
    <div class="sheet-date-dow" id="sheetDateDow"></div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<!-- 길찾기 앱 선택 팝업 시트 -->
<div class="sheet-backdrop" id="mapSheetBackdrop"></div>
<div class="sheet" id="mapSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-date-label">길찾기 앱 선택</div>
    <div class="sheet-date-dow" style="color: var(--text-sub);">연세곰돌이소아청소년과의원으로 안내합니다.</div>
  </div>
  <div class="sheet-body" style="padding: 20px 16px 30px;">
    <button class="nav-map-btn" onclick="openMap('naver')">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 22px;">💚</span>
        <span>네이버 지도</span>
      </div>
      <span style="color: var(--text-sub); font-size: 14px;">앱 실행 ›</span>
    </button>
    <button class="nav-map-btn" onclick="openMap('kakao')">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 22px;">💛</span>
        <span>카카오맵</span>
      </div>
      <span style="color: var(--text-sub); font-size: 14px;">앱 실행 ›</span>
    </button>
    <button class="nav-map-btn" onclick="openMap('tmap')">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 22px;">💙</span>
        <span>티맵 (TMAP)</span>
      </div>
      <span style="color: var(--text-sub); font-size: 14px;">앱 실행 ›</span>
    </button>
  </div>
</div>
<script>
const KIM = "김현", YANG = "양희규";
const state = { year: new Date().getFullYear(), month: new Date().getMonth()+1, loading: false, data: null };
const $ = id => document.getElementById(id);
const PALETTE_BG   = ["rgba(10,132,255,0.85)","rgba(255,159,10,0.85)","rgba(48,209,88,0.85)","rgba(255,69,58,0.85)","rgba(191,90,242,0.85)","rgba(100,210,255,0.85)","rgba(255,105,97,0.85)","rgba(255,214,10,0.85)"];
const PALETTE_PILL = ["rgba(10,132,255,0.18)","rgba(255,159,10,0.18)","rgba(48,209,88,0.18)","rgba(255,69,58,0.18)","rgba(191,90,242,0.18)","rgba(100,210,255,0.18)","rgba(255,105,97,0.18)","rgba(255,214,10,0.18)"];
const PALETTE_TEXT = ["#409cff","#ffb340","#30d158","#ff453a","#da8fff","#64d2ff","#ff6961","#ffd60a"];
function nameHash(name) { let h=0; for (const c of name) h=(h*31+c.charCodeAt(0))&0xffff; return h%PALETTE_BG.length; }
function toDate(s) { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function isPast(s) { const t=new Date(); t.setHours(0,0,0,0); return toDate(s)<t; }
function isToday(y,m,d) { const t=new Date(); return t.getFullYear()===y&&t.getMonth()+1===m&&t.getDate()===d; }
const DOW_KO = ["일","월","화","수","목","금","토"];
function dow(s) { return DOW_KO[toDate(s).getDay()]; }
function yangVisibleOnDay(kimR, yangR) {
  if (!kimR) return true;
  const ks=parseInt(kimR.start),ke=parseInt(kimR.end),ys=parseInt(yangR.start),ye=parseInt(yangR.end);
  return !(ys>=ks&&ye<=ke);
}
function badge(name, r) { const s=parseInt(r.start),e=parseInt(r.end); return `${name===KIM?"김":"양"} ${s}~${e}`; }
function updateHeader() { $("headerMonth").textContent=`${state.month}월`; $("headerYear").textContent=` ${state.year}`; }
function openSheet(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  const dowStr = DOW_KO[new Date(y,m-1,d).getDay()];
  $("sheetDateLabel").textContent = `${m}월 ${d}일`;
  $("sheetDateDow").textContent   = `${dowStr}요일`;
  $("sheetDateDow").style.color   = dowStr==="일"?"#ff453a":dowStr==="토"?"#409cff":"var(--text-sub)";
  const allDay = (state.data&&state.data.all) ? (state.data.all[dateStr]||[]) : [];
  let html = "";
  if (allDay.length===0) {
    html = `<div class="sheet-empty"><div class="sheet-empty-icon">🏥</div><div>등록된 근무자 정보가 없습니다</div></div>`;
  } else {
    allDay.forEach(doc => {
      const idx=nameHash(doc.name), bg=PALETTE_BG[idx], pill=PALETTE_PILL[idx], txt=PALETTE_TEXT[idx];
      const sh=parseInt(doc.start), eh=parseInt(doc.end);
      html += `<div class="duty-card">
        <div class="duty-avatar" style="background:${bg}">${doc.name.slice(0,1)}</div>
        <div class="duty-info">
          <div class="duty-name">${doc.name} 원장</div>
          <div class="duty-time">${sh}:00 – ${eh}:00 · ${eh-sh}시간</div>
        </div>
        <div class="duty-time-pill" style="background:${pill};color:${txt}">${sh}~${eh}시</div>
      </div>`;
    });
  }
  $("sheetBody").innerHTML = html;
  $("sheetBackdrop").classList.add("visible");
  $("sheet").classList.add("visible");
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  $("sheetBackdrop").classList.remove("visible");
  $("sheet").classList.remove("visible");
  document.body.style.overflow = "";
}
$("sheetBackdrop").addEventListener("click", closeSheet);
let touchStartY = 0;
$("sheet").addEventListener("touchstart", e => { touchStartY=e.touches[0].clientY; }, {passive:true});
$("sheet").addEventListener("touchend",   e => { if (e.changedTouches[0].clientY-touchStartY>60) closeSheet(); }, {passive:true});

// 길찾기 팝업 관련 함수 및 이벤트
function openMapSheet() {
  $("mapSheetBackdrop").classList.add("visible");
  $("mapSheet").classList.add("visible");
  document.body.style.overflow = "hidden";
}
function closeMapSheet() {
  $("mapSheetBackdrop").classList.remove("visible");
  $("mapSheet").classList.remove("visible");
  document.body.style.overflow = "";
}
$("mapSheetBackdrop").addEventListener("click", closeMapSheet);
let mapTouchStartY = 0;
$("mapSheet").addEventListener("touchstart", e => { mapTouchStartY=e.touches[0].clientY; }, {passive:true});
$("mapSheet").addEventListener("touchend",   e => { if (e.changedTouches[0].clientY-mapTouchStartY>60) closeMapSheet(); }, {passive:true});

function openMap(type) {
  const dlat = 37.4839884;
  const dlng = 126.9950796;
  const dname = encodeURIComponent("연세곰돌이소아청소년과의원");
  let url = "";

  if (type === "naver") {
    url = `nmap://route/car?dlat=${dlat}&dlng=${dlng}&dname=${dname}&appname=kr.gomdori`;
  } else if (type === "kakao") {
    url = `kakaomap://route?ep=${dlat},${dlng}&by=CAR`;
  } else if (type === "tmap") {
    url = `tmap://route?rGoName=${dname}&rGoX=${dlng}&rGoY=${dlat}`;
  }

  if (url) {
    location.href = url;
    closeMapSheet();
  }
}
function renderGrid() {
  const {year,month,data} = state;
  const grid = $("calendarGrid");
  if (state.loading) { grid.innerHTML=`<div class="status-wrap" style="grid-column:1/-1"><div class="spinner"></div>불러오는 중...</div>`; $("listSection").style.display="none"; return; }
  const kimD={}, yangD={};
  if (data) { (data[KIM]||[]).forEach(r=>kimD[r.date]=r); (data[YANG]||[]).forEach(r=>yangD[r.date]=r); }
  const firstDow=new Date(year,month-1,1).getDay(), days=new Date(year,month,0).getDate();
  let html="";
  for (let i=0;i<firstDow;i++) html+=`<div class="cal-cell empty"></div>`;
  for (let d=1;d<=days;d++) {
    const ds=`${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dw=(firstDow+d-1)%7;
    const cls=["cal-cell",dw===0?"sun":dw===6?"sat":"",isToday(year,month,d)?"today":""].filter(Boolean).join(" ");
    const past=isPast(ds);
    let badges="";
    if (kimD[ds]) badges+=`<span class="doc-badge badge-kim${past?" past":""}">${badge(KIM,kimD[ds])}</span>`;
    if (yangD[ds]&&yangVisibleOnDay(kimD[ds]||null,yangD[ds])) badges+=`<span class="doc-badge badge-yang${past?" past":""}">${badge(YANG,yangD[ds])}</span>`;
    html+=`<div class="${cls}" data-date="${ds}"><div class="cal-day-num">${d}</div>${badges}</div>`;
  }
  grid.innerHTML = html;
  grid.onclick = e => { const cell=e.target.closest("[data-date]"); if (cell) openSheet(cell.dataset.date); };
  renderLists(kimD, yangD);
}
function renderLists(kimD, yangD) {
  $("listSection").style.display="";
  const t=new Date(), todayStr=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  
  const isCurrentMonth = (state.year === t.getFullYear() && state.month === t.getMonth()+1);
  
  let kimRows, yangRows;
  if (isCurrentMonth) {
    const limit = new Date(t.getTime() + 7 * 24 * 60 * 60 * 1000);
    const limitStr = `${limit.getFullYear()}-${String(limit.getMonth()+1).padStart(2,"0")}-${String(limit.getDate()).padStart(2,"0")}`;
    kimRows = Object.keys(kimD).filter(ds=>ds>=todayStr && ds<=limitStr).sort();
    yangRows = Object.keys(yangD).filter(ds=>ds>=todayStr && ds<=limitStr && yangVisibleOnDay(kimD[ds]||null,yangD[ds])).sort();
  } else {
    kimRows = Object.keys(kimD).filter(ds=>ds>=todayStr).sort();
    yangRows = Object.keys(yangD).filter(ds=>ds>=todayStr && yangVisibleOnDay(kimD[ds]||null,yangD[ds])).sort();
  }
  
  const allDates=[...new Set([...kimRows,...yangRows])].sort();
  let kimHtml="", yangHtml="";
  if (allDates.length===0) { kimHtml=`<div class="list-empty">일정 없음</div>`; yangHtml=kimHtml; }
  else {
    allDates.forEach(ds => {
      const [,mm,dd]=ds.split("-"), label=`${+mm}/${+dd} (${dow(ds)})`;
      kimHtml  += kimD[ds]&&kimRows.includes(ds)  ? `<div class="list-row"><div class="list-date">${label}</div><div class="list-time">${kimD[ds].start}:00 – ${kimD[ds].end}:00</div></div>`  : `<div class="list-row placeholder"></div>`;
      yangHtml += yangD[ds]&&yangRows.includes(ds) ? `<div class="list-row"><div class="list-date">${label}</div><div class="list-time">${yangD[ds].start}:00 – ${yangD[ds].end}:00</div></div>` : `<div class="list-row placeholder"></div>`;
    });
  }
  $("kimList").innerHTML=kimHtml; $("yangList").innerHTML=yangHtml;
}
async function updateDuration() {
  const el = $("navDuration");
  const val = $("durationVal");
  try {
    const res = await fetch("/api/duration");
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (data.duration_min !== null && data.duration_min !== undefined) {
      val.textContent = `병원까지 ${data.duration_min}분`;
      el.style.display = "flex";
    } else {
      el.style.display = "none";
    }
  } catch(e) {
    el.style.display = "none";
  }
}
async function load(force=false) {
  if (state.loading) return;
  state.loading=true; state.data=null; updateHeader(); renderGrid(); $("refreshBtn").disabled=true;
  try {
    const res=await fetch(force?`/api/refresh?year=${state.year}&month=${state.month}`:`/api/schedule?year=${state.year}&month=${state.month}`, {method:force?"POST":"GET"});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.data=(await res.json()).schedule;
  } catch(e) {
    $("calendarGrid").innerHTML=`<div class="status-wrap" style="grid-column:1/-1">⚠️ 불러오기 실패<br><small style="color:#636366">${e.message}</small></div>`;
    state.loading=false; $("refreshBtn").disabled=false; return;
  }
  state.loading=false; $("refreshBtn").disabled=false; renderGrid();
  updateDuration();
}
$("prevBtn").onclick  = () => { state.month===1?(state.year--,state.month=12):state.month--; load(); };
$("nextBtn").onclick  = () => { state.month===12?(state.year++,state.month=1):state.month++; load(); };
$("todayBtn").onclick = () => { const n=new Date(); state.year=n.getFullYear(); state.month=n.getMonth()+1; load(); };
$("refreshBtn").onclick = () => load(true);
load();
</script>
</body>
</html>
